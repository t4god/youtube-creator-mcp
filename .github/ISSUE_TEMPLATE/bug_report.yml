name: Bug report
description: Report a reproducible problem in YouTube Creator MCP
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include OAuth files, tokens, API keys, or private channel data.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Linux, Windows]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include sanitized errors and exact reproduction steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
